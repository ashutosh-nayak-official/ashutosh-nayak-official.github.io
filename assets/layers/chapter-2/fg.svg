<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- PLACEHOLDER layer: chapter 2 foreground — factory beams + large gear
       silhouettes in the bottom corners. Top ~65% intentionally transparent. -->
  <g fill="#2A1F12" fill-opacity="0.55">
    <!-- riveted vertical beam, left edge -->
    <rect x="0" y="0" width="56" height="900"/>
    <rect x="56" y="120" width="16" height="780" fill-opacity="0.35"/>
    <!-- diagonal roof brace, top-left -->
    <polygon points="0,0 340,0 56,210 0,210"/>
    <!-- horizontal beam, bottom -->
    <rect x="0" y="846" width="1600" height="54"/>

    <!-- ============ LARGE GEAR, bottom-left ============ -->
    <g transform="translate(210,860) rotate(12)">
      <g>
        <rect x="-24" y="-218" width="48" height="46"/>
        <rect x="-24" y="-218" width="48" height="46" transform="rotate(30)"/>
        <rect x="-24" y="-218" width="48" height="46" transform="rotate(60)"/>
        <rect x="-24" y="-218" width="48" height="46" transform="rotate(90)"/>
        <rect x="-24" y="-218" width="48" height="46" transform="rotate(120)"/>
        <rect x="-24" y="-218" width="48" height="46" transform="rotate(150)"/>
        <rect x="-24" y="-218" width="48" height="46" transform="rotate(180)"/>
        <rect x="-24" y="-218" width="48" height="46" transform="rotate(210)"/>
        <rect x="-24" y="-218" width="48" height="46" transform="rotate(240)"/>
        <rect x="-24" y="-218" width="48" height="46" transform="rotate(270)"/>
        <rect x="-24" y="-218" width="48" height="46" transform="rotate(300)"/>
        <rect x="-24" y="-218" width="48" height="46" transform="rotate(330)"/>
      </g>
      <path d="M 0 -180 A 180 180 0 1 0 0.01 -180 Z M 0 -64 A 64 64 0 1 1 -0.01 -64 Z" fill-rule="evenodd"/>
      <circle r="26"/>
    </g>

    <!-- ============ SMALLER MESHING GEAR, bottom-right ============ -->
    <g transform="translate(1430,888) rotate(-8)">
      <g>
        <rect x="-18" y="-158" width="36" height="36"/>
        <rect x="-18" y="-158" width="36" height="36" transform="rotate(36)"/>
        <rect x="-18" y="-158" width="36" height="36" transform="rotate(72)"/>
        <rect x="-18" y="-158" width="36" height="36" transform="rotate(108)"/>
        <rect x="-18" y="-158" width="36" height="36" transform="rotate(144)"/>
        <rect x="-18" y="-158" width="36" height="36" transform="rotate(180)"/>
        <rect x="-18" y="-158" width="36" height="36" transform="rotate(216)"/>
        <rect x="-18" y="-158" width="36" height="36" transform="rotate(252)"/>
        <rect x="-18" y="-158" width="36" height="36" transform="rotate(288)"/>
        <rect x="-18" y="-158" width="36" height="36" transform="rotate(324)"/>
      </g>
      <path d="M 0 -130 A 130 130 0 1 0 0.01 -130 Z M 0 -46 A 46 46 0 1 1 -0.01 -46 Z" fill-rule="evenodd"/>
      <circle r="20"/>
    </g>

    <!-- riveted vertical beam, right edge -->
    <rect x="1556" y="300" width="44" height="600"/>
  </g>

  <!-- rivet dots on the beams -->
  <g fill="#E8D9BC" fill-opacity="0.3">
    <circle cx="28" cy="260" r="6"/>
    <circle cx="28" cy="380" r="6"/>
    <circle cx="28" cy="500" r="6"/>
    <circle cx="28" cy="620" r="6"/>
    <circle cx="28" cy="740" r="6"/>
    <circle cx="1578" cy="420" r="5"/>
    <circle cx="1578" cy="540" r="5"/>
    <circle cx="1578" cy="660" r="5"/>
    <circle cx="1578" cy="780" r="5"/>
  </g>

  <text x="84" y="838" font-family="monospace" font-size="16" fill="#2A1F12" fill-opacity="0.35">PLACEHOLDER chapter-2 fg — supply 2400×1350 transparent png/webp</text>
</svg>
