        <rect x="280" y="820" width="4" height="18"/>
        <rect x="330" y="820" width="4" height="12"/>
        <rect x="380" y="820" width="4" height="18"/>
        <rect x="430" y="820" width="4" height="12"/>
        <rect x="480" y="820" width="4" height="18"/>
        <rect x="530" y="820" width="4" height="12"/>
