    <path d="M 690 508 Q 668 532 690 548 Q 702 557 688 560" stroke-width="3"/>
    <path d="M 850 508 Q 828 532 850 548 Q 862 557 848 560" stroke-width="3"/>

    <!-- ============ ENGINE DECK (flat, behind seat) ============ -->
    <path d="M 900 522 H 1160"/>
    <path d="M 910 522 L 910 560" stroke-width="3"/>
    <path d="M 1150 522 L 1150 558" stroke-width="3"/>

    <!-- single vertical cylinder + head -->
    <path d="M 1080 522 V 434 H 1128 V 522"/>
    <path d="M 1090 434 V 412 H 1118 V 434" stroke-width="3"/>

    <!-- large horizontal flywheel (edge-on) + shaft -->
    <ellipse cx="952" cy="580" rx="96" ry="16"/>
    <path d="M 952 564 V 522" stroke-width="3"/>

    <!-- belt drive to rear axle pulley -->
    <circle cx="1050" cy="622" r="34" stroke-width="3"/>
    <path d="M 1096 528 L 1078 594" stroke-width="3"/>

    <!-- ============ blueprint dimension marks ============ -->
    <g stroke-width="2" stroke-dasharray="8 8" stroke-opacity="0.5">
      <path d="M 1050 452 V 396"/>
      <path d="M 455 588 V 396"/>
      <path d="M 455 408 H 1050"/>
      <path d="M 377 800 V 824 M 1202 800 V 824 M 377 812 H 1202"/>
