<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- PLACEHOLDER layer: chapter 1 subject — 1886 Benz Patent-Motorwagen,
       blueprint line drawing (side view, facing right).
       Supply final art: 2400×1350 transparent png/webp or refined SVG. -->
  <g fill="none" stroke="#2B5D8A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">

    <!-- ground line -->
    <path d="M 280 776 H 1320" stroke-width="2.5" stroke-dasharray="14 10" stroke-opacity="0.55"/>

    <!-- ============ REAR WHEEL (large, spoked) ============ -->
    <circle cx="1050" cy="622" r="152"/>
    <circle cx="1050" cy="622" r="140"/>
    <circle cx="1050" cy="622" r="14"/>
    <g stroke-width="3">
      <path d="M 1064 622 L 1190 622"/>
      <path d="M 1060 632 L 1149 721"/>
      <path d="M 1050 636 L 1050 762"/>
