      <path d="M 448 680 L 400 632"/>
      <path d="M 455 677 L 455 609"/>
      <path d="M 462 680 L 510 632"/>
    </g>

    <!-- ============ CHASSIS (bent-tube frame) ============ -->
    <path d="M 430 560 H 1118"/>
    <path d="M 1118 560 Q 1144 576 1132 602 L 1066 618"/>
    <path d="M 430 560 Q 410 562 400 580"/>

    <!-- front fork -->
    <path d="M 441 656 L 441 588"/>
    <path d="M 469 656 L 469 588"/>
    <path d="M 441 588 Q 455 576 469 588"/>

    <!-- ============ TILLER STEERING ============ -->
    <path d="M 455 588 L 455 452"/>
    <path d="M 455 452 Q 468 428 500 422"/>
    <circle cx="508" cy="421" r="7" stroke-width="3"/>

    <!-- curved dash / footboard between steering and seat -->
    <path d="M 472 524 Q 560 546 646 510"/>
    <path d="M 520 560 Q 580 586 648 584" stroke-width="3"/>

    <!-- ============ BENCH SEAT (open, sprung) ============ -->
    <path d="M 650 470 H 880"/>
    <path d="M 650 486 H 874" stroke-width="3"/>
    <path d="M 650 470 Q 642 490 650 508"/>
    <path d="M 880 470 Q 904 428 898 372 Q 896 350 878 358"/>
