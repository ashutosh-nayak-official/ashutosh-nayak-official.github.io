      <path d="M 1040 612 L 951 523"/>
      <path d="M 1050 608 L 1050 482"/>
      <path d="M 1060 612 L 1149 523"/>
    </g>

    <!-- ============ FRONT WHEEL (smaller, spoked) ============ -->
    <circle cx="455" cy="687" r="88"/>
    <circle cx="455" cy="687" r="78"/>
    <circle cx="455" cy="687" r="10"/>
    <g stroke-width="3">
      <path d="M 465 687 L 533 687"/>
      <path d="M 462 694 L 510 742"/>
      <path d="M 455 697 L 455 765"/>
      <path d="M 448 694 L 400 742"/>
