<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#04050a" />
    <title>Page not found — Ashutosh Nayak</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #04050a;
        --ink: #f1ead9;
        --muted: #9c9384;
        --gold: #f3b24a;
        --gold-hi: #ffe1a0;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font: 400 16px/1.6 'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        display: grid;
        place-content: center;
        gap: 18px;
        min-height: 100svh;
        padding: 32px 16px;
        text-align: center;
      }
      .code {
        margin: 0;
        font: 500 12px 'JetBrains Mono', ui-monospace, monospace;
        letter-spacing: 0.18em;
        color: var(--gold);
      }
      h1 {
        margin: 0;
        font-size: clamp(28px, 6vw, 44px);
        font-weight: 650;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      a {
        justify-self: center;
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 0 24px;
        border: 1px solid var(--gold);
        border-radius: 999px;
        color: var(--gold-hi);
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        background: color-mix(in srgb, var(--gold) 14%, transparent);
      }
      a:focus-visible {
        outline: 2px solid var(--gold-hi);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>This page does not exist.</h1>
      <p>The link may be old or mistyped.</p>
      <a href="/">Back to the start</a>
    </main>
  </body>
</html>
